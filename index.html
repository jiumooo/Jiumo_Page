<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酒墨的页面</title>
  <link rel="stylesheet" href="assets/css/style.css?v=40">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div>
        <h1 class="site-title"><a href="index.html" id="siteTitle">酒墨的页面</a></h1>
        <p class="site-subtitle" id="siteDesc"></p>
      </div>
      <div class="header-search" id="headerSearchWrap">
        <input type="text" class="search-box" id="searchBox" placeholder="搜索标题、标签或正文…">
      </div>
      <div class="header-actions" id="headerBtns">
        <!-- 自定义快捷按钮、暗色切换按钮由后台配置渲染 -->
        <a class="hdr-btn" href="admin/index.html" title="打开管理设置">设置</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="layout">

      <!-- 左栏：头像卡 + 左侧模块（可后台配置） -->
      <aside class="layout-left">
        <div class="profile-card">
          <img id="profileAvatar" class="avatar shape-circle" alt="头像" src="">
          <h2 class="profile-name" id="profileName"></h2>
          <p class="profile-intro" id="profileIntro"></p>
          <p class="profile-typing"><span id="typedTarget"></span></p>
        </div>
        <div class="sidebar-modules" id="leftModules"></div>
      </aside>

      <!-- 中栏：文章列表 -->
      <div class="layout-main">
        <!-- 骨架屏由 blog.js 拿到文章列表后一次性按实际数量渲染，不再预置固定数量 -->
        <div class="post-list" id="postList"></div>
      </div>

      <!-- 右栏：右侧模块（多模块，可后台配置启用/参数/排序/位置） -->
      <aside class="layout-right">
        <div class="sidebar-panel" id="sidebarPanel">
          <div class="sidebar-modules" id="sidebarModules">
            <!-- 加载骨架屏：模块渲染后由 config.js 替换 -->
            <div class="skeleton-panel">
              <div class="sk sk-title"></div>
              <div class="sk sk-line"></div>
            </div>
            <div class="skeleton-panel">
              <div class="sk sk-title"></div>
              <div class="sk sk-line"></div>
            </div>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      由 Jiumo_Page 驱动 · 托管于 GitHub Pages
      <span id="pvWrap"> · <span id="busuanzi_value_site_pv"></span> 次浏览</span>
    </div>
  </footer>

  <!-- 右下角固定按钮：返回顶部 + 深浅色切换 -->
  <div class="corner-btns">
    <button class="corner-btn" id="btnTop" title="返回顶部" aria-label="返回顶部">↑</button>
    <button class="corner-btn" id="btnDark" title="切换深浅色" aria-label="切换深浅色">☾</button>
  </div>

  <script src="assets/js/config.js?v=40"></script>
  <script src="assets/vendor/marked.min.js?v=40"></script>
  <script src="assets/js/ui.js?v=40"></script>
  <!-- 侧栏模块（独立文件夹 modules/，注册到 window.JiumoModules） -->
  <script src="modules/datetime/module.js?v=40"></script>
  <script src="modules/weather/module.js?v=40"></script>
  <script src="modules/ghchart/module.js?v=40"></script>
  <script src="modules/quotes/module.js?v=40"></script>
  <script src="modules/stats/module.js?v=40"></script>
  <script src="assets/js/blog.js?v=40"></script>
  <!-- 不蒜子浏览量统计（后台可开关） -->
  <script src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
