<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 - 酒墨的页面</title>
  <link rel="stylesheet" href="assets/css/style.css?v=46">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div>
        <h1 class="site-title"><a href="index.html" id="siteTitle">酒墨的页面</a></h1>
        <p class="site-subtitle" id="siteDesc"></p>
      </div>
      <div class="header-actions" id="headerBtns">
        <!-- 自定义快捷按钮、暗色切换按钮由后台配置渲染（设置按钮仅主页面显示） -->
      </div>
    </div>
  </header>

  <main class="container">
    <div class="layout">

      <!-- 左栏：头像卡 + 左侧模块（可后台配置） -->
      <aside class="layout-left">
        <div class="profile-card">
          <img id="profileAvatar" class="avatar shape-circle" alt="头像" src="">
          <h2 class="profile-name" id="profileName"></h2>
          <p class="profile-intro" id="profileIntro"></p>
          <p class="profile-typing"><span id="typedTarget"></span></p>
        </div>
        <div class="sidebar-modules" id="leftModules"></div>
      </aside>

      <!-- 中栏：文章详情 -->
      <div class="layout-main">
        <a class="back-link" href="index.html">← 返回文章列表</a>
        <div id="postContainer">
          <div class="state-box"><span class="spinner"></span>正在加载文章…</div>
        </div>
        <!-- 评论区已移除 -->
      </div>

      <!-- 右栏：侧栏模块（多模块，可后台配置启用/参数/排序） -->
      <aside class="layout-right">
        <div class="sidebar-panel" id="sidebarPanel">
          <div class="sidebar-modules" id="sidebarModules"></div>
        </div>
      </aside>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      由 Jiumo_Page 驱动 · 托管于 GitHub Pages
      <span id="pvWrap"> · <span id="busuanzi_value_site_pv"></span> 次浏览</span>
    </div>
  </footer>

  <!-- 右下角固定按钮：返回顶部 + 深浅色切换 -->
  <div class="corner-btns">
    <button class="corner-btn" id="btnTop" title="返回顶部" aria-label="返回顶部">↑</button>
    <button class="corner-btn" id="btnDark" title="切换深浅色" aria-label="切换深浅色">☾</button>
  </div>

  <script src="assets/js/config.js?v=46"></script>
  <script src="assets/vendor/marked.min.js?v=46"></script>
  <script src="assets/js/ui.js?v=46"></script>
  <!-- 侧栏模块（独立文件夹 modules/，注册到 window.JiumoModules） -->
  <script src="modules/datetime/module.js?v=46"></script>
  <script src="modules/weather/module.js?v=46"></script>
  <script src="modules/ghchart/module.js?v=46"></script>
  <script src="modules/quotes/module.js?v=46"></script>
  <script src="modules/stats/module.js?v=46"></script>
  <script src="assets/js/blog.js?v=46"></script>
  <!-- 不蒜子浏览量统计（后台可开关） -->
  <script src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
